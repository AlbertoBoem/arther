<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ARTHER — a WebXR theremin</title>
<style>
  :root {
    /* Pulled directly from thereminModel.js so the launch screen and the
       AR scene read as one object, not two different designs. --brass,
       --filament and --field are exact matches for that file's AMBER,
       AMBER_HOT and CYAN; --lacquer/--lacquer-lift/--brass-dim are the
       only values with no literal AR equivalent (the scene has no
       background fill), so they're derived at AMBER's own hue instead of
       picked separately. */
    --lacquer: #19130a;
    --lacquer-lift: #241c0f;
    --brass: #ffc978;       /* == AMBER */
    --brass-dim: #a77f44;   /* muted AMBER, for secondary text/borders */
    --filament: #fff4d6;    /* == AMBER_HOT */
    --field: #7fe6ff;       /* == CYAN */
    --ink: #d9c2a0;         /* body copy: AMBER at low saturation, easier to read at length */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--lacquer);
    color: var(--filament);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  canvas { display: block; }

  /* ---- 2D launch screen (hidden once the AR session starts) ---- */
  #stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: safe center;
    overflow-y: auto;
    gap: 22px;
    padding: 24px;
    text-align: center;
    z-index: 10;
    background:
      radial-gradient(90% 70% at 50% 62%, rgba(255, 201, 120, .07) 0%, transparent 70%),
      radial-gradient(120% 90% at 50% 8%, var(--lacquer-lift) 0%, var(--lacquer) 62%);
  }

  /* In an immersive session the page must contribute nothing: the launch UI is
     hidden AND the opaque page background is cleared, or it shows through as a
     dark panel behind the AR content. main.js also sets these inline, matching
     the reference app, in case the class never lands. */
  body.xr #stage { display: none; }
  html.xr, body.xr {
    background: transparent !important;
    background-color: transparent !important;
  }
  /* Optional: also drop the canvas out of page layout while presenting. The XR
     compositor owns the framebuffer, so the on-page canvas isn't needed. */
  body.xr.hide-canvas canvas { display: none !important; }

  h1 {
    font-size: clamp(30px, 11vw, 62px);
    font-weight: 300;
    letter-spacing: .42em;
    text-indent: .42em;      /* keeps the tracked word optically centred */
    text-transform: uppercase;
    color: var(--filament);
  }

  .sub {
    margin-top: 12px;
    font-size: 12px;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--brass);
  }

  .how {
    max-width: 34ch;
    font-size: 15px;
    line-height: 1.65;
    color: var(--ink);
  }
  .how b { color: var(--brass); font-weight: 500; }
  .how em { color: var(--field); font-style: normal; }

  /* Buttons borrow the AR scene's look: thin glowing lines, no solid fill.
     Amber is the pitch/primary colour, cyan the secondary one. */
  #enter {
    appearance: none;
    padding: 15px 40px;
    font: inherit;
    font-size: 13px;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: var(--filament);
    background: rgba(255, 201, 120, .06);
    border: 1px solid var(--brass); border-radius: 2px;
    box-shadow: 0 0 14px rgba(255, 201, 120, .35), inset 0 0 14px rgba(255, 201, 120, .16);
    text-shadow: 0 0 8px rgba(255, 201, 120, .7);
    cursor: pointer;
    transition: background .2s ease, box-shadow .2s ease, transform .2s ease, opacity .2s ease;
  }
  #enter:hover:enabled {
    background: rgba(255, 201, 120, .16);
    box-shadow: 0 0 24px rgba(255, 201, 120, .6), inset 0 0 18px rgba(255, 201, 120, .3);
    transform: translateY(-1px);
  }
  #enter:focus-visible { outline: 2px solid var(--field); outline-offset: 4px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
    justify-content: center;
  }

  #enter:disabled {
    background: transparent; color: var(--brass-dim); border-color: var(--brass-dim);
    box-shadow: none; text-shadow: none; opacity: .55; cursor: default;
  }

  #test.secondary {
    appearance: none;
    font: inherit;
    font-size: 13px;
    letter-spacing: .26em;
    text-transform: uppercase;
    background: rgba(127, 230, 255, .04);
    color: var(--field);
    border: 1px solid rgba(127, 230, 255, .6); border-radius: 2px;
    box-shadow: 0 0 12px rgba(127, 230, 255, .25), inset 0 0 12px rgba(127, 230, 255, .1);
    padding: 14px 26px;
    cursor: pointer;
    transition: background .2s ease, box-shadow .2s ease;
  }
  #test.secondary:hover:enabled {
    background: rgba(127, 230, 255, .12);
    box-shadow: 0 0 22px rgba(127, 230, 255, .5), inset 0 0 16px rgba(127, 230, 255, .22);
  }
  #test.secondary:disabled { opacity: .35; box-shadow: none; cursor: default; }

  #status {
    min-height: 1.4em;
    font-size: 12px;
    letter-spacing: .12em;
    color: var(--brass-dim);
  }
  #status.error { color: #ff9a7a; }

  hr.rule {
    width: 120px; height: 1px; border: 0;
    background: linear-gradient(90deg, transparent, var(--brass), transparent);
    opacity: .7;
  }

  /* Wireframe theremin: same geometry language as thereminModel.js — amber
     cabinet and pitch antenna on the right, cyan volume loop on the left. */
  .instrument { width: min(78vw, 340px); height: auto; overflow: visible; }
  .instrument .bead { animation: ride 5s ease-in-out infinite; }
  .instrument .rung { animation: level 2.6s ease-in-out infinite; }
  .instrument .rung:nth-child(2) { animation-delay: .15s; }
  .instrument .rung:nth-child(3) { animation-delay: .3s; }
  .instrument .rung:nth-child(4) { animation-delay: .45s; }
  .instrument .rung:nth-child(5) { animation-delay: .6s; }
  .instrument .rung:nth-child(6) { animation-delay: .75s; }
  @keyframes ride  { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-110px); } }
  @keyframes level { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
  @media (prefers-reduced-motion: reduce) {
    .instrument .bead, .instrument .rung { animation: none; }
  }

  /* ---- optional local backing-track picker (CONFIG.backingTrack.source
     === 'local'). Hidden by default; main.js reveals it when relevant. ---- */
  #trackPicker {
    display: none;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    color: var(--brass);
  }
  #trackPicker input[type="file"] {
    /* visually hidden but still focusable/keyboard-operable */
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
  #trackPicker .file-label {
    appearance: none;
    padding: 10px 20px;
    font: inherit;
    font-size: 12px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--field);
    background: transparent;
    border: 1px solid rgba(127, 230, 255, .5);
    border-radius: 2px;
    cursor: pointer;
    transition: color .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  #trackPicker .file-label:hover {
    color: var(--filament); border-color: var(--field);
    box-shadow: 0 0 14px rgba(127, 230, 255, .4);
  }
  #trackFileName {
    color: var(--ink);
    max-width: 22ch;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

</style>
</head>
<body>

  <div id="stage">
    <div>
      <h1>ARTHER</h1>
      <p class="sub">Theremin for Spectacles</p>
    </div>

    <svg class="instrument" viewBox="0 0 380 250" role="img" aria-label="Wireframe theremin with a pitch antenna on the right and a volume loop on the left">
      <defs>
        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="2.2" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- pitch side: octave rings, cabinet, knobs, antenna (amber) -->
      <g filter="url(#glow)" fill="none" stroke-linejoin="round">
        <g stroke="#ffc978" stroke-width="1" opacity=".22">
          <ellipse cx="277" cy="95" rx="40"  ry="11"/>
          <ellipse cx="277" cy="95" rx="70"  ry="20"/>
          <ellipse cx="277" cy="95" rx="100" ry="28"/>
        </g>
        <g stroke="#ffc978" stroke-width="1.4" opacity=".9">
          <rect x="95" y="178" width="190" height="52"/>
          <polygon points="95,178 113,164 303,164 285,178"/>
          <polygon points="285,178 303,164 303,216 285,230"/>
        </g>
        <g stroke="#ffc978" stroke-width="1.6" opacity=".85">
          <ellipse cx="168" cy="171" rx="7" ry="2.4"/>
          <ellipse cx="207" cy="171" rx="7" ry="2.4"/>
        </g>
        <line x1="277" y1="178" x2="277" y2="24" stroke="#ffc978" stroke-width="9" opacity=".15"/>
        <line x1="277" y1="178" x2="277" y2="24" stroke="#fff4d6" stroke-width="2.4"/>
        <circle class="bead" cx="277" cy="150" r="5.5" fill="#fff4d6" fill-opacity=".55" stroke="#fff4d6" stroke-width="1"/>
      </g>

      <!-- volume side: loop, stem, dead-zone bubble, level ladder (cyan) -->
      <g filter="url(#glow)" fill="none" stroke="#7fe6ff">
        <ellipse cx="70" cy="178" rx="50" ry="14" stroke-width="2.4"/>
        <line x1="120" y1="178" x2="95" y2="178" stroke-width="2"/>
        <circle cx="70" cy="178" r="17" fill="#7fe6ff" fill-opacity=".1" stroke-width=".8" opacity=".5"/>
        <g stroke-width="2.2">
          <line class="rung" x1="52" y1="156" x2="88" y2="156"/>
          <line class="rung" x1="52" y1="145" x2="88" y2="145"/>
          <line class="rung" x1="51" y1="134" x2="89" y2="134"/>
          <line class="rung" x1="51" y1="123" x2="89" y2="123"/>
          <line class="rung" x1="50" y1="112" x2="90" y2="112"/>
          <line class="rung" x1="50" y1="101" x2="90" y2="101"/>
        </g>
      </g>

      <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" letter-spacing="3" text-anchor="middle">
        <text x="277" y="248" fill="#ffc978" opacity=".75">PITCH</text>
        <text x="70"  y="248" fill="#7fe6ff" opacity=".75">VOLUME</text>
      </g>
    </svg>

    <hr class="rule">

    <p class="how">
      Place the virtual Theremin in front of you. Use your <b>right hand</b> to
      control the pitch, and your <em>left hand</em> to control the volume.
    </p>

    <div id="trackPicker">
      <label class="file-label" for="trackFile">Choose backing track…</label>
      <input type="file" id="trackFile" accept="audio/*">
      <span id="trackFileName">No file chosen — loop stays off until you pick one</span>
    </div>


    <div class="actions">
      <button id="enter" disabled>Start playing</button>
      <button id="test" class="secondary" disabled>Test tone</button>
    </div>
    <p id="status">Checking this device…</p>
  </div>

  <!-- Diagnostics first. Nothing in here can fail to resolve, so it is always
       available to report on whatever fails next. -->
  <script>
  (function () {
    var el = null;
    var reported = false;
    function status(message, isError) {
      el = el || document.getElementById('status');
      if (isError) reported = true;
      if (!el) { console.log('[aether]', message); return; }
      el.textContent = message;
      el.classList.toggle('error', !!isError);
    }
    window.__aether = { ready: false, status: status };

    // Resource load errors don't bubble, so listen in the capture phase.
    window.addEventListener('error', function (event) {
      var target = event.target;
      if (target && target.tagName === 'SCRIPT') {
        if (target.dataset && target.dataset.optional) return;  // has a fallback
        status('Failed to load ' + (target.src || 'a script') + '.', true);
      } else if (event.message) {
        status('Error: ' + event.message, true);
      }
    }, true);

    window.addEventListener('unhandledrejection', function (event) {
      var reason = event.reason;
      status('Error: ' + ((reason && reason.message) || reason), true);
    });

    // Last-resort watchdog. It must never clobber an error that was already
    // reported — a specific message beats this guess every time.
    setTimeout(function () {
      if (!window.__aether.ready && !reported) {
        status('App script never ran, and nothing reported why. Check the console.', true);
      }
    }, 6000);
  })();
  </script>

  <!-- App logic lives in main.js and its imports (config.js, mapping.js,
       hands.js, thereminModel.js, thereminAudio.js). three.module.js must
       sit alongside this file; no import map needed since every import
       uses a relative path. -->
  <script type="module" src="./main.js"></script>
</body>
</html>
